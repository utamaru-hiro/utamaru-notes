<svg xmlns="http://www.w3.org/2000/svg" width="960" height="360" viewBox="0 0 960 360" role="img" aria-labelledby="title desc">
  <title id="title">Negative feedback block diagram</title>
  <desc id="desc">Reference R enters a summing junction, the error E goes through G, output Y is fed back through H with a negative sign.</desc>
  <rect width="960" height="360" fill="#fffaf1"/>
  <g font-family="Helvetica, Arial, sans-serif" fill="#2f2412">
    <text x="62" y="128" font-size="28" font-weight="700">R(s)</text>
    <text x="252" y="128" font-size="28" font-weight="700">E(s)</text>
    <text x="806" y="128" font-size="28" font-weight="700">Y(s)</text>
    <circle cx="188" cy="170" r="34" fill="#fff" stroke="#8a5a00" stroke-width="4"/>
    <text x="176" y="162" font-size="24" font-weight="700">+</text>
    <text x="178" y="191" font-size="24" font-weight="700">−</text>
    <rect x="330" y="122" width="190" height="96" rx="18" fill="#ffe8b7" stroke="#8a5a00" stroke-width="4"/>
    <rect x="520" y="248" width="160" height="76" rx="18" fill="#ffe8b7" stroke="#8a5a00" stroke-width="4"/>
    <text x="407" y="178" font-size="32" font-weight="700">G(s)</text>
    <text x="578" y="295" font-size="30" font-weight="700">H(s)</text>
    <text x="248" y="88" font-size="22">E = R − HY</text>
    <text x="560" y="88" font-size="22">Y = GE</text>
  </g>
  <g stroke="#2f2412" stroke-width="5" fill="none" stroke-linecap="round" stroke-linejoin="round">
    <path d="M110 170 H154"/>
    <path d="M222 170 H330"/>
    <path d="M520 170 H792"/>
    <path d="M792 170 V286 H680"/>
    <path d="M520 286 H188"/>
    <path d="M188 286 V204"/>
    <polygon points="154,170 140,162 140,178" fill="#2f2412"/>
    <polygon points="330,170 316,162 316,178" fill="#2f2412"/>
    <polygon points="792,170 778,162 778,178" fill="#2f2412"/>
    <polygon points="680,286 666,278 666,294" fill="#2f2412"/>
    <polygon points="188,204 180,218 196,218" fill="#2f2412"/>
  </g>
</svg>