<svg xmlns="http://www.w3.org/2000/svg" width="960" height="460" viewBox="0 0 960 460" role="img" aria-labelledby="title desc">
  <title id="title">Nyquist diagram and stability margins</title>
  <desc id="desc">Nyquist contour L(jω) in the complex plane with the critical point -1 and phase/gain margin annotations.</desc>
  <rect width="960" height="460" fill="#fffaf1"/>
  <!-- Axes -->
  <g stroke="#2f2412" stroke-width="4" fill="none">
    <path d="M80 230 H880"/>
    <path d="M480 50 V420"/>
    <polygon points="880,230 864,222 864,238" fill="#2f2412"/>
    <polygon points="480,50 472,66 488,66" fill="#2f2412"/>
  </g>
  <!-- Unit circle (dashed) -->
  <circle cx="480" cy="230" r="150" stroke="#c8b08a" stroke-width="2" stroke-dasharray="8 6" fill="none"/>
  <!-- Nyquist curve L(jω): starts at large value on negative real axis, spirals inward -->
  <!-- ω: 0→∞, curve goes from left on real axis toward -1, circles around, ends at origin -->
  <path d="M130 230
           C 145 230 175 220 210 205
           C 250 188 295 178 340 196
           C 375 210 400 230 420 258
           C 440 285 455 300 456 310
           C 458 322 462 316 470 300
           C 476 288 479 265 480 245"
        stroke="#8a5a00" stroke-width="6" fill="none" stroke-linecap="round" stroke-linejoin="round"/>
  <!-- Arrow on curve showing direction -->
  <polygon points="345,196 330,192 336,206" fill="#8a5a00"/>
  <!-- -1 point -->
  <circle cx="330" cy="230" r="10" fill="#c06f00"/>
  <!-- Dashed lines for PM and GM annotations -->
  <!-- PM: angle from negative real axis to the point where |L|=1 on the unit circle -->
  <line x1="480" y1="230" x2="366" y2="122" stroke="#c06f00" stroke-width="3" stroke-dasharray="8 6"/>
  <!-- GM: from -1 to where curve crosses negative real axis -->
  <line x1="330" y1="230" x2="130" y2="230" stroke="#2f7a2f" stroke-width="3" stroke-dasharray="8 6"/>

  <!-- Labels -->
  <g font-family="Helvetica, Arial, sans-serif" fill="#2f2412">
    <text x="836" y="222" font-size="24">Re(L)</text>
    <text x="494" y="70" font-size="24">Im(L)</text>
    <!-- -1 label -->
    <text x="298" y="256" font-size="22" font-weight="700" fill="#c06f00">−1</text>
    <!-- Origin -->
    <text x="486" y="256" font-size="20">O</text>
    <!-- Curve label -->
    <text x="200" y="178" font-size="20" fill="#8a5a00">L(jω)</text>
    <text x="160" y="200" font-size="18" fill="#8a5a00">ω : 0 → ∞</text>
    <!-- GM annotation -->
    <text x="180" y="222" font-size="19" fill="#2f7a2f">← GM →</text>
    <!-- PM annotation -->
    <text x="358" y="118" font-size="19" fill="#c06f00">PM</text>
    <!-- End point annotation -->
    <text x="440" y="240" font-size="18" fill="#8a5a00">ω→∞</text>
    <!-- Stability note -->
    <text x="570" y="350" font-size="20" fill="#1a5c2a" font-weight="700">−1 点を囲まない</text>
    <text x="572" y="374" font-size="20" fill="#1a5c2a">→ 安定（N = 0）</text>
    <!-- -1 not encircled circle indicator -->
    <circle cx="330" cy="230" r="55" stroke="#c06f00" stroke-width="3" stroke-dasharray="6 6" fill="none"/>
  </g>
</svg>
