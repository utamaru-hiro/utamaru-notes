<svg xmlns="http://www.w3.org/2000/svg" width="960" height="460" viewBox="0 0 960 460" role="img" aria-labelledby="title desc">
  <title id="title">Second-order step response comparison</title>
  <desc id="desc">Step responses for underdamped (zeta=0.3), critically damped (zeta=1), and overdamped (zeta=2) second-order systems.</desc>
  <rect width="960" height="460" fill="#fffaf1"/>
  <!-- Axes -->
  <g stroke="#2f2412" stroke-width="4" fill="none">
    <path d="M100 390 H880"/>
    <path d="M100 390 V50"/>
    <polygon points="880,390 864,382 864,398" fill="#2f2412"/>
    <polygon points="100,50 92,66 108,66" fill="#2f2412"/>
  </g>
  <!-- Final value line (y=1) -->
  <line x1="100" y1="170" x2="870" y2="170" stroke="#c8b08a" stroke-width="2" stroke-dasharray="8 6"/>
  <!-- Grid: y=1.4 -->
  <line x1="100" y1="90" x2="870" y2="90" stroke="#c8b08a" stroke-width="1" stroke-dasharray="4 6" opacity="0.6"/>

  <!-- ζ=0.3 underdamped curve (rises fast, overshoots to ~1.37, oscillates) -->
  <!-- Normalized to: x(100..850), y(170=1.0, 390=0, 90=1.4) -->
  <!-- Scale: 220px = 1 unit y, 750px = ~10s normalized time -->
  <path d="M100 390
           C 150 390 170 300 200 170
           C 220 100 250 80 280 95
           C 310 108 330 148 360 165
           C 390 178 420 172 450 168
           C 490 164 530 170 570 171
           C 640 171 720 170 850 170"
        stroke="#c06f00" stroke-width="6" fill="none" stroke-linecap="round" stroke-linejoin="round"/>

  <!-- ζ=1 critically damped (monotone, medium speed) -->
  <path d="M100 390
           C 150 390 200 340 260 270
           C 310 218 360 196 420 183
           C 490 173 560 170 680 170
           C 760 170 810 170 850 170"
        stroke="#2f7a2f" stroke-width="6" fill="none" stroke-linecap="round" stroke-linejoin="round"/>

  <!-- ζ=2 overdamped (slow, monotone) -->
  <path d="M100 390
           C 140 390 180 380 220 355
           C 280 320 340 285 400 256
           C 460 228 520 207 580 196
           C 640 186 700 179 760 175
           C 800 172 830 171 850 170"
        stroke="#5a7abc" stroke-width="6" fill="none" stroke-linecap="round" stroke-linejoin="round"/>

  <!-- Labels -->
  <g font-family="Helvetica, Arial, sans-serif" fill="#2f2412">
    <text x="855" y="385" font-size="24">t</text>
    <text x="60" y="62" font-size="26" font-weight="700">y(t)</text>
    <!-- y-axis values -->
    <text x="54" y="176" font-size="22" text-anchor="end">1.0</text>
    <text x="54" y="96" font-size="22" text-anchor="end">1.4</text>
    <line x1="96" y1="170" x2="104" y2="170" stroke="#2f2412" stroke-width="3"/>
    <!-- y=0 -->
    <text x="50" y="390" font-size="20">0</text>
    <!-- Curve labels -->
    <text x="256" y="72" font-size="20" fill="#c06f00" font-weight="700">ζ = 0.3（不足減衰）</text>
    <text x="480" y="270" font-size="20" fill="#2f7a2f" font-weight="700">ζ = 1（臨界減衰）</text>
    <text x="580" y="315" font-size="20" fill="#5a7abc" font-weight="700">ζ = 2（過減衰）</text>
    <!-- Final value label -->
    <text x="700" y="160" font-size="19" fill="#8a5a00">最終値</text>
  </g>
</svg>
