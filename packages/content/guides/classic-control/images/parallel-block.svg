<svg xmlns="http://www.w3.org/2000/svg" width="960" height="340" viewBox="0 0 960 340" role="img" aria-labelledby="title desc">
  <title id="title">Parallel connection block diagram</title>
  <desc id="desc">Input U splits into two branches G1 and G2, then the outputs are summed to become Y.</desc>
  <rect width="960" height="340" fill="#fffaf1"/>
  <g font-family="Helvetica, Arial, sans-serif" fill="#2f2412">
    <text x="70" y="178" font-size="28" font-weight="700">U(s)</text>
    <text x="812" y="178" font-size="28" font-weight="700">Y(s)</text>
    <rect x="280" y="66" width="180" height="84" rx="18" fill="#ffe8b7" stroke="#8a5a00" stroke-width="4"/>
    <rect x="280" y="196" width="180" height="84" rx="18" fill="#ffe8b7" stroke="#8a5a00" stroke-width="4"/>
    <circle cx="690" cy="170" r="28" fill="#fff" stroke="#8a5a00" stroke-width="4"/>
    <text x="678" y="179" font-size="30" font-weight="700">+</text>
    <text x="336" y="116" font-size="30" font-weight="700">G₁(s)</text>
    <text x="336" y="246" font-size="30" font-weight="700">G₂(s)</text>
    <text x="510" y="104" font-size="24">Y₁ = G₁U</text>
    <text x="510" y="252" font-size="24">Y₂ = G₂U</text>
  </g>
  <g stroke="#2f2412" stroke-width="5" fill="none" stroke-linecap="round" stroke-linejoin="round">
    <path d="M116 170 H170"/>
    <path d="M170 170 H170 V108 H280"/>
    <path d="M170 170 V238 H280"/>
    <path d="M460 108 H662"/>
    <path d="M460 238 H662"/>
    <path d="M718 170 H798"/>
    <polygon points="170,170 156,162 156,178" fill="#2f2412"/>
    <polygon points="280,108 266,100 266,116" fill="#2f2412"/>
    <polygon points="280,238 266,230 266,246" fill="#2f2412"/>
    <polygon points="662,108 648,100 648,116" fill="#2f2412"/>
    <polygon points="662,238 648,230 648,246" fill="#2f2412"/>
    <polygon points="798,170 784,162 784,178" fill="#2f2412"/>
  </g>
</svg>