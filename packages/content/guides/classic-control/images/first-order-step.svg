<svg xmlns="http://www.w3.org/2000/svg" width="960" height="440" viewBox="0 0 960 440" role="img" aria-labelledby="title desc">
  <title id="title">First-order step response</title>
  <desc id="desc">Step response of a first-order system showing exponential rise to final value K, with time constant T marked at 63.2%.</desc>
  <rect width="960" height="440" fill="#fffaf1"/>
  <!-- Axes -->
  <g stroke="#2f2412" stroke-width="4" fill="none">
    <path d="M100 380 H880"/>
    <path d="M100 380 V60"/>
    <polygon points="880,380 864,372 864,388" fill="#2f2412"/>
    <polygon points="100,60 92,76 108,76" fill="#2f2412"/>
  </g>
  <!-- Grid lines (dashed) -->
  <g stroke="#c8b08a" stroke-width="2" stroke-dasharray="8 6" fill="none">
    <!-- y = K line -->
    <path d="M100 90 H860"/>
    <!-- y = 0.63K line -->
    <path d="M100 261 H290"/>
    <!-- x = T vertical -->
    <path d="M290 90 V380"/>
    <!-- x = 2T, 3T, 4T, 5T verticals -->
    <path d="M430 90 V380"/>
    <path d="M570 90 V380"/>
    <path d="M710 90 V380"/>
    <path d="M850 90 V380"/>
  </g>
  <!-- Tangent line at origin (dashed) -->
  <line x1="100" y1="380" x2="390" y2="90" stroke="#8a5a00" stroke-width="3" stroke-dasharray="10 8"/>
  <!-- Step response curve: K(1 - e^(-t/T)), approximated as bezier -->
  <!-- Points: (100,380)→(290,261)→(430,151)→(570,114)→(710,97)→(850,91) -->
  <path d="M100 380 C140 380 160 320 290 261 C380 215 410 160 430 151 C490 135 540 120 570 114 C640 103 680 96 710 97 C760 95 810 91 850 91"
        stroke="#8a5a00" stroke-width="6" fill="none" stroke-linecap="round" stroke-linejoin="round"/>
  <!-- Axis labels -->
  <g font-family="Helvetica, Arial, sans-serif" fill="#2f2412">
    <text x="855" y="374" font-size="24">t</text>
    <text x="60" y="96" font-size="26" font-weight="700">y(t)</text>
    <!-- y-axis ticks -->
    <text x="54" y="96" font-size="22" text-anchor="end">K</text>
    <text x="54" y="267" font-size="22" text-anchor="end">0.63K</text>
    <line x1="96" y1="90" x2="104" y2="90" stroke="#2f2412" stroke-width="3"/>
    <line x1="96" y1="261" x2="104" y2="261" stroke="#2f2412" stroke-width="3"/>
    <!-- x-axis ticks -->
    <text x="290" y="404" font-size="22" text-anchor="middle">T</text>
    <text x="430" y="404" font-size="22" text-anchor="middle">2T</text>
    <text x="570" y="404" font-size="22" text-anchor="middle">3T</text>
    <text x="710" y="404" font-size="22" text-anchor="middle">4T</text>
    <text x="850" y="404" font-size="22" text-anchor="middle">5T</text>
    <line x1="290" y1="376" x2="290" y2="384" stroke="#2f2412" stroke-width="3"/>
    <line x1="430" y1="376" x2="430" y2="384" stroke="#2f2412" stroke-width="3"/>
    <line x1="570" y1="376" x2="570" y2="384" stroke="#2f2412" stroke-width="3"/>
    <line x1="710" y1="376" x2="710" y2="384" stroke="#2f2412" stroke-width="3"/>
    <line x1="850" y1="376" x2="850" y2="384" stroke="#2f2412" stroke-width="3"/>
    <!-- Annotation -->
    <text x="300" y="246" font-size="19" fill="#6b4a00">63.2%（t = T）</text>
    <text x="160" y="325" font-size="18" fill="#8a5a00">接線（傾き = K/T）</text>
    <!-- 5T annotation -->
    <text x="722" y="85" font-size="18" fill="#6b4a00">99.3%（t = 5T）</text>
    <text x="50" y="380" font-size="20">0</text>
  </g>
  <!-- Dot at (T, 0.63K) -->
  <circle cx="290" cy="261" r="7" fill="#8a5a00"/>
</svg>
