<svg xmlns="http://www.w3.org/2000/svg" width="960" height="300" viewBox="0 0 960 300" role="img" aria-labelledby="title desc">
  <title id="title">Closed-loop control block diagram</title>
  <desc id="desc">Reference input, summing junction, controller, plant, output, and feedback path.</desc>
  <rect width="960" height="300" fill="#fffaf1"/>
  <g font-family="Helvetica, Arial, sans-serif" fill="#2f2412">
    <text x="64" y="88" font-size="28" font-weight="700">r(t)</text>
    <text x="64" y="230" font-size="22">reference</text>
    <circle cx="190" cy="150" r="34" fill="#fff" stroke="#8a5a00" stroke-width="4"/>
    <text x="177" y="142" font-size="24" font-weight="700">+</text>
    <text x="180" y="170" font-size="24" font-weight="700">−</text>
    <text x="248" y="88" font-size="28" font-weight="700">e(t)</text>
    <rect x="300" y="104" width="168" height="92" rx="18" fill="#ffe8b7" stroke="#8a5a00" stroke-width="4"/>
    <text x="360" y="143" font-size="30" font-weight="700">C(s)</text>
    <text x="334" y="176" font-size="20">controller</text>
    <rect x="560" y="104" width="182" height="92" rx="18" fill="#ffe8b7" stroke="#8a5a00" stroke-width="4"/>
    <text x="628" y="143" font-size="30" font-weight="700">G(s)</text>
    <text x="625" y="176" font-size="20">plant</text>
    <text x="814" y="88" font-size="28" font-weight="700">y(t)</text>
    <text x="810" y="230" font-size="22">output</text>
    <text x="456" y="64" font-size="24">u(t)</text>
    <text x="704" y="266" font-size="22">feedback</text>
  </g>
  <g stroke="#2f2412" stroke-width="5" fill="none" stroke-linecap="round" stroke-linejoin="round">
    <path d="M90 150 H156"/>
    <path d="M224 150 H300"/>
    <path d="M468 150 H560"/>
    <path d="M742 150 H842"/>
    <path d="M842 150 V242 H190"/>
    <path d="M190 242 V184"/>
    <polygon points="156,150 142,142 142,158" fill="#2f2412"/>
    <polygon points="300,150 286,142 286,158" fill="#2f2412"/>
    <polygon points="560,150 546,142 546,158" fill="#2f2412"/>
    <polygon points="842,150 828,142 828,158" fill="#2f2412"/>
    <polygon points="190,184 182,198 198,198" fill="#2f2412"/>
  </g>
</svg>