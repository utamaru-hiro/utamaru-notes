<svg xmlns="http://www.w3.org/2000/svg" width="960" height="420" viewBox="0 0 960 420" role="img" aria-labelledby="title desc">
  <title id="title">Pole locations for a second-order system</title>
  <desc id="desc">Complex plane with a conjugate pair of poles, damping ratio line, and natural frequency radius.</desc>
  <rect width="960" height="420" fill="#fffaf1"/>
  <g stroke="#2f2412" stroke-width="4" fill="none">
    <path d="M120 210 H860"/>
    <path d="M490 60 V360"/>
  </g>
  <g font-family="Helvetica, Arial, sans-serif" fill="#2f2412">
    <text x="830" y="196" font-size="24">Re(s)</text>
    <text x="506" y="82" font-size="24">Im(s)</text>
    <text x="518" y="162" font-size="22">jωd</text>
    <text x="518" y="290" font-size="22">−jωd</text>
    <text x="264" y="232" font-size="22">−ζωn</text>
    <text x="250" y="110" font-size="22">|s| = ωn</text>
    <text x="348" y="140" font-size="22">ζ line</text>
  </g>
  <g stroke="#8a5a00" stroke-width="4" fill="none">
    <path d="M490 210 L310 100" stroke-dasharray="10 10"/>
    <path d="M490 210 L310 320" stroke-dasharray="10 10"/>
    <path d="M490 210 L310 100"/>
    <path d="M490 210 L310 320"/>
    <path d="M310 100 L310 320" stroke-dasharray="8 8"/>
  </g>
  <g stroke="#c06f00" stroke-width="5">
    <line x1="490" y1="210" x2="310" y2="100"/>
    <line x1="490" y1="210" x2="310" y2="320"/>
  </g>
  <g stroke="#8a5a00" stroke-width="6">
    <line x1="292" y1="82" x2="328" y2="118"/>
    <line x1="328" y1="82" x2="292" y2="118"/>
    <line x1="292" y1="302" x2="328" y2="338"/>
    <line x1="328" y1="302" x2="292" y2="338"/>
  </g>
</svg>